# metro.samoy.love
#
# Выделен из общего launcher.conf, где раньше жили два проекта в одном файле.
# Деплой ChillHub перезаписывал этот файл целиком и снёс бы metro; теперь у
# каждого проекта свой конфиг и свой симлинк, деплои не пересекаются.
# Содержимое блоков перенесено без изменений поведения.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name metro.samoy.love;

    # Serve robots.txt and sitemap.xml over HTTP without redirect (for crawlers)
    location = /robots.txt {
        root /var/www/site;
        try_files /robots.txt =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
    location = /sitemap.xml {
        root /var/www/site;
        try_files /sitemap.xml =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name metro.samoy.love;

    ssl_certificate     /etc/letsencrypt/live/metro.samoy.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metro.samoy.love/privkey.pem;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    etag on;

    access_log /var/log/nginx/metro_access.log;
    error_log  /var/log/nginx/metro_error.log;

    root /var/www/metro;
    index index.html;

    location / {
        root /var/www/metro;
        try_files $uri /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /assets/ {
        root /var/www/metro;
        try_files $uri =404;
    }

    location = /index.html {
        root /var/www/metro;
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Explicit PWA manifest: short caching with revalidation
    location = /kitty-metro-manifest.webmanifest {
        root /var/www/metro;
        try_files /kitty-metro-manifest.webmanifest =404;
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
    }

    # Explicit service worker: must always revalidate
    location = /kitty-metro-sw.js {
        root /var/www/metro;
        try_files /kitty-metro-sw.js =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location ~* "^/.+[-.][a-f0-9]{8,}\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot)$" {
        root /var/www/metro;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/.+\.(?:css|js|mjs|map|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf|eot)$ {
        root /var/www/metro;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location ~* ^/.+\.(?:html)$ {
        root /var/www/metro;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
