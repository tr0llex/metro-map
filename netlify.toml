[build]
  command = "npm run build"
  publish = "dist"

# Netlify — запасная площадка; основной деплой это свой nginx
# (deploy/nginx/metro.conf, docs/DEPLOY.md). Заголовки продублированы здесь,
# чтобы сборка на Netlify не оказывалась заметно слабее защищённой, чем бой.
# Политика та же, что в metro.conf — правьте оба места вместе.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# Хешированные ассеты Vite — иммутабельно на год.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker и манифест обязаны ревалидироваться, иначе обновление не доедет.
[[headers]]
  for = "/kitty-metro-sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/kitty-metro-manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
