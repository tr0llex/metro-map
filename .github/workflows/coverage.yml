name: Покрытие main

# ЗАЧЕМ ОТДЕЛЬНЫЙ ВОРКФЛОУ, А НЕ ШАГ В ci.yml.
#
# Codecov привязывает отчёт к КОММИТУ, а бейдж и «project»-статус считает по
# ветке по умолчанию. Отчёты из ci.yml приходят на коммиты веток PR — для main
# они не приезжают никогда, потому что ci.yml намеренно ходит только по
# pull_request (см. комментарий к его триггеру).
#
# Пока этого файла не было, данные main стояли на месте: бейдж в README
# показывал 16.91% из прогона недельной давности, тогда как в PR считалось
# 30.38%. Бейдж покрытия, который не обновляется, — ровно то «украшение,
# которое врёт», от которого его и заводили.
#
# Возвращать `push: branches: [main]` в ci.yml было бы дороже: там ещё линтеры,
# сборка, сквозные тесты и сторож качества — всё это уже отработало на PR и на
# том же дереве. Здесь только то, что даёт цифру.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Мержи иногда идут подряд, и вытеснять предыдущий счёт заманчиво: важен
# последний main. Но воркфлоу ходит ТОЛЬКО по push в main, а отменённый прогон
# main — это потерянная цифра коммита, который уже уехал в прод: в Codecov она
# не приедет никогда, и бейдж останется висеть на предыдущем мерже. Здесь то же
# условие по ветке, что в ci.yml, чтобы правило читалось одинаково во всех
# воркфлоу: на ветке вытеснять полезно, на main нельзя.
concurrency:
  group: coverage-main
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  coverage:
    name: Покрытие main в Codecov
    runs-on: ubuntu-latest
    # Здесь только install и test:unit, без линта, сборки и e2e — легче job'а
    # build из ci.yml, поэтому и запас ниже.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ровно та же команда, что и на PR: цифры обязаны считаться одинаково,
      # иначе сравнение «PR против main» перестаёт что-либо значить.
      - name: Test
        run: npm run test:unit

      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          # Здесь строго: молча не отправленный отчёт означает застывший бейдж,
          # а это ровно та поломка, ради которой файл и заведён.
          fail_ci_if_error: true
