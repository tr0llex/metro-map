name: Deploy

# Механика выкатки — в deploy-kit. Здесь только что катим и какой регресс
# обязан пройти.
#
# Триггер общий для всех проектов samoy.love: мерж в main уезжает на прод.
#
# Раньше здесь стоял только ручной запуск, и довод был такой: приложение
# раздаётся офлайн-PWA, у пользователей с установленным service worker новая
# версия подхватывается по своим правилам, значит выкатка должна быть решением.
# Но это описывает поведение service worker, а не момент выкатки: когда клиент
# увидит новую версию, определяет он, а не то, нажали кнопку руками или пришёл
# мерж. Взамен main переставал быть выкатываемым — ровно то состояние, из-за
# которого «что сейчас на проде» приходится выяснять, а не знать.

on:
  push:
    branches: [main]
    paths-ignore:
      # Опасное направление здесь одно: спрятать от выкатки файл, который
      # влияет на dist, — тогда прод молча остаётся на старой сборке, и об
      # этом никто не сообщит. Поэтому список сверен с входами сборки, а не
      # с общими соображениями.
      #
      # Шаблон '**.md' безопасен, но безопасен он не сам по себе. Markdown
      # лежит не только в корне и docs/: есть ещё data/README.md — а data/
      # это КАТАЛОГ ВХОДНЫХ ДАННЫХ. Проверено по коду, а не по раскладке:
      # солвер (go-layout-solver) читает из data/ только *.json — layout.json,
      # transfers.json и glob по lines/*.json, — а сборка фронта туда вообще
      # не ходит: граф приезжает готовым файлом normalized/fullGraph.json,
      # который статически импортирует src/metro/fullGraph.ts. Ни один .md не
      # читается ни сборкой, ни гейтами. Копировать эту строку в репозиторий,
      # где текст страниц лежит в markdown, нельзя: там шаблон спрячет от
      # выкатки правку самого прода.
      - '**.md'
      # docs/ — документация, эталоны visual-qa (два десятка PNG) и
      # docs/metro-reference/*.json. Справочник по линиям держат для сверки
      # руками: ни в src/, ни в scripts/, ни в vite.config.ts на него нет ни
      # одной ссылки, данные карты идут из data/ и normalized/. Эталоны
      # снимков читает tools/visual-qa, а он в гейты не входит. Обновление
      # снимков и справочника не меняет dist, и гонять из-за них прод незачем.
      #
      # Обратная сторона: normalized/fullGraph.json и data/ под ignore НЕ
      # попадают ни одним шаблоном — это коммитимые входы сборки, и правка
      # схемы обязана уезжать на прод.
      - 'docs/**'
      # Настройки редактора в гейт не входят: eslint их не читает, prettier
      # в зависимостях нет.
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Показать план, ничего не менять'
        type: boolean
        default: false

# Минимальные права для GITHUB_TOKEN. Выкатка ходит на сервер по SSH
# секретами, токен ей нужен только для checkout.
#
# deployments: write — чтобы связь «коммит → выкатка» была видна из GitHub, а
# не только по логам. Запись Deployment ставится на тот же SHA, что уехал на
# прод, и показывается на самом коммите и в панели Environments; версия релиза
# (release-<дата>-<sha>) и поле commit в version.json указывают в ту же точку.
# Переиспользуемый workflow не может иметь прав больше, чем дал вызывающий,
# поэтому право обязано стоять с ОБЕИХ сторон. Половинки въезжают независимо:
# пока в deploy-kit шага ещё нет, лишнее право ничего не делает, а когда шаг
# появится раньше этой строки — он обязан пережить 403 и не уронить выкатку.
# Пропавшая запись — косметика, упавшая выкатка — нет.
permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: samoy-love/deploy-kit/.github/workflows/static-site.yml@main
    with:
      config: .deploy-kit/prod.env
      # nginx-conf не передаём: этот вход ждёт путь в ЭТОМ репозитории, а
      # конфигурация nginx живёт только в deploy-kit. Какой файл оттуда взять,
      # сказано в описании цели (NGINX_CONF в .deploy-kit/prod.env) — его читают
      # и пайплайн, и `dk deploy`, поэтому конфиг едет одинаково обоими путями.
      #
      # Без повторного `vitest run --coverage`: полный прогон юнитов с
      # покрытием уже отработал на этом дереве в ci.yml (гейт мержа в PR) — тот
      # же коммит, те же файлы, тот же результат. Здесь остаётся то, что PR
      # ещё не проверял: типы, линт, токены CSS, сама сборка и то, что
      # редактор не попал в прод-бандл. Красный = выкатки нет.
      gates: >-
        npm ci &&
        npx tsc -b &&
        npm run lint &&
        npm run check:css &&
        npm run build &&
        npm run check:bundle
      dry-run: ${{ inputs.dry-run == true }}
    secrets: inherit
