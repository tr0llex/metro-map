name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # CSS-переменные не проверяет ничто из стандартных гейтов: tsc не смотрит
      # в CSS, ESLint его не разбирает, Vite не валидирует custom properties.
      # Один var(--foo) без объявления обнуляет ВСЁ правило.
      - name: Check CSS custom properties
        run: npm run check:css

      - name: Test
        run: npx vitest run --coverage

      - name: Отправить покрытие в Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      # Редактор схемы обязан вырезаться из прод-сборки. Вырезание держится на
      # сворачивании мёртвой ветки Rollup-ом и ломается молча — проверяем фактом.
      - name: Check editor is absent from production bundle
        run: node scripts/check-prod-bundle.mjs

  quality:
    name: Metro map quality (no drift from baseline)
    runs-on: ubuntu-latest

    # Раньше здесь стоял `continue-on-error: true` и `npm run quality:check`.
    # quality:check возвращает 1 всегда, пока хоть одна метрика в FAIL, а она в
    # FAIL постоянно и осознанно — то есть job был жёлтым всегда. Сигнал, который
    # всегда красный, перестаёт быть сигналом: отличить «всё как обычно» от
    # «я только что сломал раскладку» было невозможно.
    #
    # Поэтому проверяем не абсолютные пороги, а ДРЕЙФ относительно закоммиченной
    # базовой линии normalized/quality_report.json. Анализатор детерминирован
    # (см. docs/QUALITY.md), поэтому при неизменных данных и коде отчёт совпадает
    # байт в байт. Job зелёный ровно тогда, когда схема не менялась, и красный
    # ровно тогда, когда менялась — включая улучшения: новый отчёт надо
    # закоммитить вместе с правкой.
    #
    # Пороги FAIL/WARN при этом остаются как есть и продолжают печататься в
    # отчёте — они описывают цель, а не текущее состояние.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recompute layout quality report
        run: npm run quality

      - name: Report must match committed baseline
        run: |
          if ! git diff --exit-code -- normalized/quality_report.json; then
            echo "::error::normalized/quality_report.json разошёлся с пересчитанным."
            echo "Если схема менялась осознанно — запустите 'npm run quality' и закоммитьте отчёт."
            echo "Если нет — это регресс: смотрите дифф выше."
            exit 1
          fi
          echo "Отчёт совпал с базовой линией — дрейфа нет."
