name: CI

on:
  # ТОЛЬКО pull_request. Раньше здесь был ещё push во все ветки, кроме main, и
  # каждый джоб выполнялся ДВАЖДЫ: один раз на пуш ветки, второй — на тот же
  # коммит в PR. Это не удвоенная надёжность, а удвоенное время и деньги: в
  # metro-map сквозные тесты идут минутами, и половина этих минут уходила в
  # прогон, результат которого никто не читает.
  #
  # Гейт — мерж, а мерж идёт через PR, поэтому проверять нужно ровно то, что
  # мержится: pull_request считает проверки на результате слияния с main, а не
  # на голой ветке. Ветка без PR остаётся непроверенной сознательно — её и не
  # во что мержить.
  pull_request:
  # Для ветки без PR: запустить руками, если понадобилось.
  workflow_dispatch:

# Минимальные права для GITHUB_TOKEN: CI только читает код. Без этого блока
# действуют настройки репозитория, и любой шаг (включая сторонние actions)
# получает тот токен, который там выставлен.
permissions:
  contents: read

jobs:
  # Соглашение из CLAUDE.md, проверяемое машиной.
  #
  # Записанного правила оказалось мало: трейлер `Co-Authored-By: Claude` уехал
  # в опубликованную историю, и убирать его пришлось переписыванием. Локальный
  # хук (.githooks/commit-msg) ловит это раньше, но он включается вручную и в
  # клоне отсутствует — здесь страховка.
  commits:
    name: Коммиты без упоминаний ИИ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Проверить сообщения
        run: |
          # Событие всегда pull_request (см. блок on:), поэтому диапазон один:
          # то, что ветка добавляет к своей базе.
          RANGE="origin/${{ github.base_ref }}..HEAD"
          echo "проверяю $RANGE"

          BAD=$(git log "$RANGE" --format='%H %B' \
            | grep -iE '^Co-[Aa]uthored-[Bb]y:.*(claude|anthropic|copilot|gpt)|(generated|created|written) with .*(claude|copilot|chatgpt)|🤖' \
            || true)

          if [ -n "$BAD" ]; then
            echo "::error::в сообщениях коммитов есть упоминания ИИ — авторство принадлежит владельцу репозитория (CLAUDE.md)"
            echo "$BAD"
            exit 1
          fi
          echo "чисто"

  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    # Было 30: после #52 (шардирование сверок раскладки) реальное время —
    # 8-16 минут. 18 оставляет запас, но перестаёт ждать полчаса зависший шаг.
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # CSS-переменные не проверяет ничто из стандартных гейтов: tsc не смотрит
      # в CSS, ESLint его не разбирает, Vite не валидирует custom properties.
      # Один var(--foo) без объявления обнуляет ВСЁ правило.
      - name: Check CSS custom properties
        run: npm run check:css

      - name: Test
        # Набор разбит на два прогона по ЦЕНЕ, а не по смыслу.
        #
        # Инструментация v8 замедляет горячий числовой цикл раскладки подписей
        # раз в двадцать: секунда счёта превращается в 15-25 секунд. Сверок,
        # которым нужен свой прогон алгоритма, было три — то есть под покрытием
        # они стоили около минуты из полутора, что занимал весь шаг.
        #
        # Покрытие модуля раскладки даёт ЛЮБАЯ из трёх одинаково: строки
        # исполняются те же. Поэтому под покрытием остался один прогон (сверка
        # с эталоном), а два повторных уехали в соседний шаг без покрытия.
        # Замерено: 30.38% до разбиения и 30.38% после, 487 тестов и там и там.
        run: npm run test:unit

      - name: Повторные прогоны раскладки
        # Без --coverage: инструментировать здесь нечего, покрытие уже снято
        # шагом выше. Отдельным шагом, а не хвостом предыдущего, чтобы падение
        # было видно по имени, — и чтобы пропустить его молча было нельзя.
        run: npm run test:repeat

      - name: Отправить покрытие в Codecov
        # Приколот к SHA, а не к тегу: тег мутабелен, и у Codecov уже был
        # прецедент компрометации релиза. Обновление — осознанная однострочная
        # правка с новым SHA рядом с комментарием версии.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Build
        run: npm run build

      # Редактор схемы обязан вырезаться из прод-сборки. Вырезание держится на
      # сворачивании мёртвой ветки Rollup-ом и ломается молча — проверяем фактом.
      - name: Check editor is absent from production bundle
        run: node scripts/check-prod-bundle.mjs

  e2e:
    name: Сквозные тесты (путь пользователя)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Юниты проверяют функции, а проверка после выкатки — код ответа и версию.
    # Между ними остаётся дыра: схема не отрисовалась, маршрут не построился,
    # service worker не встал — приложение при этом честно отдаёт 200.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Кэшируем ровно ту версию браузера, что просит установленный Playwright:
      # иначе после обновления пакета в кэше останется несовместимый бинарник.
      - name: Playwright version
        id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}

      # Ставим только Chromium: прогон идёт в нём одном, остальные браузеры —
      # лишние сотни мегабайт на каждый PR.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Конфиг сам собирает проект и поднимает preview: офлайн и service worker
      # существуют только в прод-сборке.
      - name: End-to-end tests
        run: npm run e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  quality:
    name: Metro map quality (no drift from baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Раньше здесь стоял `continue-on-error: true` и `npm run quality:check`.
    # quality:check возвращает 1 всегда, пока хоть одна метрика в FAIL, а она в
    # FAIL постоянно и осознанно — то есть job был жёлтым всегда. Сигнал, который
    # всегда красный, перестаёт быть сигналом: отличить «всё как обычно» от
    # «я только что сломал раскладку» было невозможно.
    #
    # Поэтому проверяем не абсолютные пороги, а ДРЕЙФ относительно закоммиченной
    # базовой линии normalized/quality_report.json. Анализатор детерминирован
    # (см. docs/QUALITY.md), поэтому при неизменных данных и коде отчёт совпадает
    # байт в байт. Job зелёный ровно тогда, когда схема не менялась, и красный
    # ровно тогда, когда менялась — включая улучшения: новый отчёт надо
    # закоммитить вместе с правкой.
    #
    # Пороги FAIL/WARN при этом остаются как есть и продолжают печататься в
    # отчёте — они описывают цель, а не текущее состояние.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recompute layout quality report
        run: npm run quality

      - name: Report must match committed baseline
        run: |
          if ! git diff --exit-code -- normalized/quality_report.json; then
            echo "::error::normalized/quality_report.json разошёлся с пересчитанным."
            echo "Если схема менялась осознанно — запустите 'npm run quality' и закоммитьте отчёт."
            echo "Если нет — это регресс: смотрите дифф выше."
            exit 1
          fi
          echo "Отчёт совпал с базовой линией — дрейфа нет."

  # Переименование или слияние задачи CI не красит сам прогон в красный — им
  # тут же становится защита ветки main, и не сразу: required_status_checks
  # хранит СТАРОЕ имя задачи, ждёт его вечно, а следующий PR просто не может
  # смержиться без единого красного шага, объясняющего причину. Правится
  # руками в Settings → Branches, и руками же забывается.
  #
  # Эта задача сверяет фактические имена задач текущего прогона (через Jobs
  # API — это то же самое, что видит защита ветки, а не то, что написано в
  # workflow-файле) со списком required_status_checks.contexts ветки main и
  # падает при расхождении в любую сторону: пропавшая обязательная проверка
  # и новая незащищённая — одинаково стоит заметить.
  protection-sync:
    name: Защита ветки соответствует задачам CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # needs — не про очерёдность результата, а про то, что видит Jobs API.
    # GitHub регистрирует задачу с зависимостями в API прогона только когда
    # её needs выполнены и она реально стартовала — без needs эта задача
    # финиширует за секунды и застаёт API в момент, когда остальные задачи
    # ещё не созданы, а не пропущены. Итог — те же ложные "пропала проверка",
    # от которых задача должна защищать.
    needs:
      - commits
      - build
      - e2e
      - quality
    if: always()
    env:
      # У GITHUB_TOKEN нет scope "administration" — читать защиту ветки
      # им нельзя. Нужен fine-grained PAT (Administration: Read-only +
      # Actions: Read-only), заводится вручную в secrets.
      GH_TOKEN: ${{ secrets.PROTECTION_READ_TOKEN }}
    steps:
      # Секреты репозитория не отдаются прогонам dependabot и форков — там
      # PAT приходит пустым. Сверять нечего: задача проверяет настройку
      # репозитория, а не содержимое PR, и на своих ветках отработает та же
      # проверка. Падать здесь — значит красить чужие PR за то, чего они не
      # ломали, поэтому пропускаем явно и вслух.
      - name: Пропустить сверку без доступа к защите ветки
        if: env.GH_TOKEN == ''
        run: |
          echo "::notice::PAT недоступен (dependabot или форк) — сверка защиты ветки пропущена"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.GH_TOKEN != ''

      - name: Сверить задачи с обязательными проверками main
        if: env.GH_TOKEN != ''
        env:
          # Задача не может требовать защиты самой себя на первом прогоне —
          # main её ещё не видел.
          SELF_JOB_NAME: Защита ветки соответствует задачам CI
        run: bash ci/branch-protection-check.sh

  # Топология боевого контура публичному репозиторию не нужна: проверка
  # ловит её в добавленных строках, в сообщениях коммитов и в описании PR.
  # Шаблоны и разбор — в deploy-kit, ci/infra-hygiene.sh.
  infra:
    name: Гигиена инфраструктуры
    uses: samoy-love/deploy-kit/.github/workflows/infra-hygiene.yml@main
