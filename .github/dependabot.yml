version: 2

# Обновления зависимостей раз в неделю, по понедельникам: реже — и копится
# пачка, которую разбирают залпом и потому невнимательно; чаще — и PR
# перестают читать вовсе.
#
# open-pull-requests-limit держит очередь короткой намеренно. Двадцать
# открытых PR от бота — это не двадцать обновлений, а ноль.
#
# Сообщения на русском в повелительном наклонении, как везде в этих
# репозиториях (CLAUDE.md). Префикс deps: отделяет машинные правки от
# человеческих.

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
  - package-ecosystem: 'npm'
    directory: '/tools/visual-qa'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
  - package-ecosystem: 'gomod'
    directory: '/go-layout-solver'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
  - package-ecosystem: 'docker'
    directory: '/tools/visual-qa'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
