<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Метро Москвы">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9ec"/>
      <stop offset="0.55" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Знак: буква М, собранная как сходящиеся линии метро.
       Три штриха + узел в вершине — метафора пересадочного узла. -->
  <g fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 344 V190"/>
    <path d="M150 190 L256 288 L362 190"/>
    <path d="M362 190 V344"/>
  </g>

  <!-- Пересадочный узел в вершине «М» -->
  <circle cx="256" cy="288" r="27" fill="#ffffff"/>
  <circle cx="256" cy="288" r="12" fill="#ec4899"/>

  <!-- Конечные станции -->
  <circle cx="150" cy="344" r="16" fill="#ffffff"/>
  <circle cx="362" cy="344" r="16" fill="#ffffff"/>
</svg>
