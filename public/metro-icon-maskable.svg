<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Метро Москвы">
  <!--
    Знак: буква «М» из сходящихся штрихов — линии метро, сходящиеся в
    пересадочный узел.

    Фон — чернильный сланец, тот же единственный акцент интерфейса. Первая
    версия была светло-розовой, и белый штрих давал на ней 1.28–1.85 : 1 при
    минимуме 3 : 1 для графики. Сменивший её розово-фиолетовый градиент читался,
    но стоял в 5.3 ΔE00 от Некрасовской линии — знак приложения был цветом
    ветки. На нынешнем градиенте (#46557a → #1c2536, 15.8 и 29.2 ΔE00 до
    ближайшей линии) белое даёт 7.4–15.4 : 1.

    Мелких деталей нет сознательно: иконка живёт в 16–48 px, там выживают только
    крупный силуэт и один акцент.
  -->
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46557a"/>
      <stop offset="1" stop-color="#1c2536"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bgm)"/>

  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
  <g fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <path d="M148 350 V186"/>
    <path d="M148 186 L256 292 L364 186"/>
    <path d="M364 186 V350"/>
  </g>

  <!-- Пересадочный узел: радиус заведомо больше половины штриха, иначе тонет в нём -->
  <circle cx="256" cy="292" r="34" fill="#ffffff"/>
  <circle cx="256" cy="292" r="15" fill="#2f3d5b"/>
  </g>
</svg>
