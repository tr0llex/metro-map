<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Language" content="ru" />
    <link rel="icon" type="image/svg+xml" href="/metro-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Метро Москвы" />
    <meta name="description" content="Офлайн-схема московского метро: маршруты, пересадки и время в пути" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16101c" media="(prefers-color-scheme: dark)" />
    <title>Метро Москвы</title>
    <script>
      /* Тема применяется ДО первого кадра, иначе принудительно тёмная тема даёт
         вспышку светлой на старте. Логика продублирована в src/utils/theme.ts —
         правьте оба места вместе (ключ и допустимые значения). */
      (function () {
        try {
          var v = localStorage.getItem('kitty-metro-theme')
          if (v === 'dark' || v === 'light') {
            document.documentElement.setAttribute('data-theme', v)
          }
        } catch (e) {
          /* приватный режим — остаётся системная тема */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
