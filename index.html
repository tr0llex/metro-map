<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Language" content="ru" />
    <link rel="icon" type="image/svg+xml" href="/metro-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Метро Москвы" />
    <meta name="description" content="Офлайн-схема московского метро: маршруты, пересадки и время в пути" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)" />
    <title>Метро Москвы</title>
    <!--
      Тема применяется ДО первого кадра (иначе принудительно тёмная даёт вспышку
      светлой), включая meta[name="theme-color"] — иначе вспыхивает системная
      строка. Скрипт вынесен из инлайна в public/theme-init.js: обычный (не
      module, не defer) внешний скрипт так же блокирует отрисовку, но при этом
      снимает необходимость в 'unsafe-inline' в script-src боевого CSP.
      В сборке файл копируется в корень dist как есть, без хеша в имени.
      Логика продублирована в src/utils/theme.ts — правьте оба места вместе.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
